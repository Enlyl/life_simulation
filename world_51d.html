    const mm=String(now.getMinutes()).padStart(2,'0');
    const ss2=String(now.getSeconds()).padStart(2,'0');
    const timeStr=hh+':'+mm+':'+ss2;
    ctx.font='bold 12px monospace';
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.textAlign='right';
    ctx.fillText(timeStr, W-8, H-8);
    ctx.textAlign='left';
  }

  // ── HUD ──────────────────────────────────────────────
  // aliveList уже определён в начале render()
  document.getElementById('sCycle').textContent     = Math.floor(cycle/3000);
  document.getElementById('sCreatures').textContent = aliveList.length;

  let sporeAlive=0;
  for(let i=0;i<spores.length;i++) if(spores[i].alive) sporeAlive++;
  document.getElementById('sSpores').textContent = sporeAlive;

  const speciesSet = new Set();
  for(let i=0;i<aliveList.length;i++) speciesSet.add(aliveList[i].color);
  document.getElementById('sSpecies').textContent = speciesSet.size;

  let mutCount=0;
  for(let i=0;i<aliveList.length;i++)
    if(!STARTER_COLORS.has(aliveList[i].color)) mutCount++;
  const mutPct = aliveList.length>0 ? Math.round(mutCount/aliveList.length*100) : 0;
  document.getElementById('sMutants').textContent = mutCount+' ('+mutPct+'%)';

  let nColony=0, nEmpire=0, nMega=0;
  const seenColors={};
  for(let i=0;i<aliveList.length;i++){
    const sc=aliveList[i]; const ss=sc.socialStatus||'solo';
    if(!seenColors[sc.color]) seenColors[sc.color]={c:false,e:false,m:false};
    if(ss==='colony') seenColors[sc.color].c=true;
    if(ss==='empire') seenColors[sc.color].e=true;
    if(ss==='mega')   seenColors[sc.color].m=true;
  }
  for(const col2 in seenColors){
    if(seenColors[col2].m) nMega++;
    if(seenColors[col2].e) nEmpire++;
    if(seenColors[col2].c) nColony++;
  }
  document.getElementById('sColonies').textContent = nColony;
  document.getElementById('sEmpires').textContent  = nEmpire;
  document.getElementById('sMegas').textContent    = nMega;

  const phaseEl = document.getElementById('sPhase');
  phaseEl.innerHTML = isNight()
    ? '<b style="color:#8888ff">🌙 Ночь</b>'
    : '<b style="color:#ccaa00">☀ День</b>';
}


function tick(){
  cycle++;
  coolBattleHeat();

  // ── ГРАВИТАЦИЯ ПОЧВЫ — блок падает сразу до дна ──
  if(cycle % 8 === 0){
    // множество занятых существами позиций
    const creaturePos = new Set();
    for(let i=0;i<creatures.length;i++){
      if(!creatures[i].alive) continue;
      for(let s=0;s<creatures[i].segments.length;s++){
        const seg=creatures[i].segments[s];
        creaturePos.add(seg.x+','+seg.y);
      }
    }
    // проходим снизу вверх
    for(let y=ROWS-2; y>=1; y--){
      for(let x=0; x<COLS; x++){
        if(!(soil[y]&&soil[y][x]&&soil[y][x].solid)) continue;
        if(soil[y+1]&&soil[y+1][x]&&soil[y+1][x].solid) continue;
        // найти куда упадёт блок
        let landY=y;
        for(let fy=y+1;fy<ROWS;fy++){
          if(soil[fy]&&soil[fy][x]&&soil[fy][x].solid) break;
          if(creaturePos.has(x+','+fy)) break;
          landY=fy;
        }
        if(landY!==y){
          soil[landY][x]=soil[y][x];
          soil[y][x]=null;
        }
      }
    }
  }
  // орогенез: горячие зоны битв растут вверх
  if(cycle % 300 === 0){
    for(let x=0;x<COLS;x++){
      if(battleHeat[x] > 5 && Math.random() < battleHeat[x]/60){
        // блок появляется на уровне активности и падает вниз
        const startY = Math.max(0, GROUND_Y - Math.floor(battleHeat[x]));
        dropSoil(x, startY, null);
      }
    }
  }
  // видовой баланс: пересчёт долей раз в 60 тиков
  if(cycle % 60 === 0){
    const totalPop = creatures.filter(x=>x.alive).length || 1;
    const colorCount = {};
    for(let x of creatures) if(x.alive) colorCount[x.color]=(colorCount[x.color]||0)+1;
    for(let x of creatures) if(x.alive) x.speciesFraction=(colorCount[x.color]||0)/totalPop;
  }
  // регенерация почвы — только цвет угасает, блоки остаются
  if(cycle % 1200 === 0){
    for(let y=GROUND_Y;y<ROWS;y++){
      for(let x=0;x<COLS;x++){
        if(soil[y]&&soil[y][x]&&soil[y][x].color&&Math.random()<0.008){
          soil[y][x].shade=Math.max(0.12,soil[y][x].shade-0.02);
          if(soil[y][x].shade<=0.13) soil[y][x].color=null; // цвет уходит, блок остаётся
        }
      }
    }
  }

  // территория постепенно угасает без присутствия империй
  if(cycle%40===0){
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(territory[y]&&territory[y][x]&&Math.random()<0.05) territory[y][x]=null;
    }
  }

  if(droughtTimer>0){droughtTimer--;if(droughtTimer===0){drought=false;addLog('☁ Засуха окончилась.');}}
  if(stormTimer>0)  {stormTimer--;  if(stormTimer===0)  {geneticStorm=false;addLog('🌙 Шторм утих.');}}
  // потоп
  if(flood){
    floodTimer--;
    // вода поднимается первые 300 тиков, затем спадает
    const risePhase = floodTimer > 400;
    if(risePhase) floodLevel = Math.min(H*0.55, floodLevel+1.2);
    else          floodLevel = Math.max(0, floodLevel-0.8);
    // утопление существ в воде
    if(cycle%8===0){
      const waterY = Math.floor((H - floodLevel)/CELL);
      for(let c2 of creatures){
        if(!c2.alive)continue;
        if(c2.head().y > waterY && Math.random()<0.03) c2.dieAsCorpse();
      }
    }
    if(floodTimer<=0){
      flood=false; floodLevel=0;
      // после отступления воды — трупы оживают
      floodAftermath();
      addLog('🌊 Вода отступила. Из трупов рождается жизнь...');
    }
  }

  // споры
  for(let sp of spores) if(sp.alive) sp.update();
  if(spores.length > 300) spores = spores.filter(sp=>sp.alive);

  // падальщики
  for(let sc of scavengers) if(sc.alive) sc.update();
  if(scavengers.length > 100) scavengers = scavengers.filter(sc=>sc.alive);

  // трупы
  for(let cp of corpses) if(cp.alive) cp.update();
  if(corpses.length>200) corpses=corpses.filter(cp=>cp.alive);

  // существа
  for(let i2=0;i2<creatures.length;i2++){ if(creatures[i2].alive) creatures[i2].update(); }
  if(creatures.length>500) creatures=creatures.filter(cr=>cr.alive);

  // жёсткий потолок по биомассе (111 единиц)
  // мега=10, империя=6, колония=3, одиночка=1
  const alive=creatures.filter(cr=>cr.alive);
  const biomass=alive.reduce((s,x)=>{
    const w=x.socialStatus==='mega'?10:x.socialStatus==='empire'?6:x.socialStatus==='colony'?3:1;
    return s+w;
  },0);
  if(biomass>400){
    const sorted=alive.slice().sort((a,b)=>a.energy-b.energy);
    let bm=biomass;
    for(let cr of sorted){
      if(bm<=400) break;
      const w=cr.socialStatus==='mega'?10:cr.socialStatus==='empire'?6:cr.socialStatus==='colony'?3:1;
      cr.die(); bm-=w;
    }
  }

  // жёсткий пол 5
  const aliveNow=creatures.filter(cr=>cr.alive);
  if(aliveNow.length<45){
    const cols=[...activeColors];
    for(let n=0;n<45-aliveNow.length;n++){
      const col=cols[Math.floor(Math.random()*cols.length)]||PALETTE[0];
      const x=5+Math.floor(Math.random()*(COLS-10));
      const top=getSoilTop(x);
      creatures.push(new Creature(x,Math.max(2,top-2),col,2));
    }
    addLog('🌱 Жизнь возрождается из пепла');
  }

  // ── СИМБИОЗ ──
  if(cycle % 150 === 0){
    const sp4 = new Set();
    for(let i=0;i<alive.length;i++) sp4.add(alive[i].color);
    const cols4 = [...sp4];
    for(let i=0;i<cols4.length;i++){
      for(let j=i+1;j<cols4.length;j++){
        const a4=cols4[i], b4=cols4[j];
        const key4=[a4,b4].sort().join('_');
        // нет войны — проверяем близость
        if(!wars[key4]){
          const ga=alive.filter(x=>x.color===a4);
          const gb=alive.filter(x=>x.color===b4);
          if(!ga.length||!gb.length) continue;
          const cxa=ga.reduce((s,x)=>s+x.head().x,0)/ga.length;
          const cxb=gb.reduce((s,x)=>s+x.head().x,0)/gb.length;
          const cya=ga.reduce((s,x)=>s+x.head().y,0)/ga.length;
          const cyb=gb.reduce((s,x)=>s+x.head().y,0)/gb.length;
          if(Math.hypot(cxa-cxb,cya-cyb)<30){
            symbiosis[key4]=(symbiosis[key4]||0)+1;
            if(symbiosis[key4]===20){
              addLog('🤝 Симбиоз: '+colorName(a4)+' и '+colorName(b4));
            }
          } else {
            if(symbiosis[key4]>0) symbiosis[key4]=Math.max(0,symbiosis[key4]-1);
          }
        }
      }
    }
  }

  // ── ВЫМИРАНИЕ ──
  if(cycle % 120 === 0){
    for(let col of [...activeColors]){
      const cnt = creatures.filter(x=>x.alive&&x.color===col).length;
      if(cnt===0 && activeColors.has(col) && !STARTER_COLORS.has(col)){
        // найти последнюю почву этого цвета
        let lastX=Math.floor(COLS/2), lastY=GROUND_Y;
        outer: for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++)
          if(soil[y]&&soil[y][x]&&soil[y][x].color===col){lastX=x;lastY=y;break outer;}
        extinctions.push({color:col,x:lastX,y:lastY,cycle});
        activeColors.delete(col);
        addLog('🪦 Вид '+colorName(col)+' вымер. Кладбище осталось.');
        // закрасить почву этого вида в тёмный оттенок
        for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++)
          if(soil[y]&&soil[y][x]&&soil[y][x].color===col)
            soil[y][x].shade = 0.18;
      }
    }
  }

  // ── ФОРМАЦИИ ИМПЕРИЙ И МЕГ ──
  if(cycle % 80 === 0){
    const aliveAdults = creatures.filter(x=>x.alive&&x.size>=12);

    // ИМПЕРИЯ — планетарная: одно ядро, остальные по орбитам
    const empColors = [...new Set(aliveAdults.filter(x=>x.socialStatus==='empire').map(x=>x.color))];
    for(const col of empColors){
      const grp = aliveAdults.filter(x=>x.color===col&&x.socialStatus==='empire');
      if(grp.length<2) continue;
      // ядро — самое крупное
      const core = grp.reduce((a,b)=>a.size>b.size?a:b);
      const orbiters = grp.filter(x=>x!==core);
      if(!formationData[col]) formationData[col]={};
      formationData[col].empire = {coreId:core.id, orbitR:14};
      // назначить угол каждому орбитеру
      orbiters.forEach((cr,i)=>{
        cr.formAngle = (2*Math.PI/orbiters.length)*i;
        cr.formRole  = 'orbit';
        cr.formCoreId = core.id;
      });
      core.formRole = 'core';
    }

    // МЕГАСТРУКТУРА — решётка: каждый знает свою ячейку
    const megaColors = [...new Set(aliveAdults.filter(x=>x.socialStatus==='mega').map(x=>x.color))];
    for(const col of megaColors){
      const grp = aliveAdults.filter(x=>x.color===col&&x.socialStatus==='mega');
      if(grp.length<2) continue;
      // центр масс
      const cx = grp.reduce((s,x)=>s+x.head().x,0)/grp.length;
      const cy = grp.reduce((s,x)=>s+x.head().y,0)/grp.length;
      // расставляем по сетке
      const cols2 = Math.ceil(Math.sqrt(grp.length));
      const spacing = 7; // расстояние между узлами решётки
      grp.forEach((cr,i)=>{
        const row = Math.floor(i/cols2), col2 = i%cols2;
        cr.formRole   = 'grid';
        cr.formGridX  = Math.round(cx + (col2 - cols2/2) * spacing);
        cr.formGridY  = Math.round(cy + (row  - cols2/2) * spacing);
      });
    }

    // Сбросить формацию у тех кто вышел из иерархии
    for(const cr of aliveAdults){
      if(cr.socialStatus==='colony'||cr.socialStatus==='solo'){
        cr.formRole=null; cr.formAngle=null; cr.formCoreId=null;
        cr.formGridX=null; cr.formGridY=null;
      }
    }
  }

  // ── ФОРМАЦИИ ИМПЕРИЙ И МЕГ ──
  if(cycle % 80 === 0){
    const aliveF = creatures.filter(x=>x.alive);

    // Группируем по цвету и статусу
    const empByColor={}, megByColor={};
    for(let cr of aliveF){
      if(cr.socialStatus==='empire'){
        if(!empByColor[cr.color]) empByColor[cr.color]=[];
        empByColor[cr.color].push(cr);
      } else if(cr.socialStatus==='mega'){
        if(!megByColor[cr.color]) megByColor[cr.color]=[];
        megByColor[cr.color].push(cr);
      }
    }

    // ИМПЕРИЯ — планетарная формация (ядро + орбита)
    for(let col in empByColor){
      const grp=empByColor[col];
      if(grp.length<3) continue;
      // ядро — самое крупное существо
      const core=grp.slice().sort((a,b)=>b.size-a.size)[0];
      core.formRole='core';
      const others=grp.filter(x=>x!==core);
      // раздаём орбитальные слоты
      const orbitR=12; // радиус орбиты в клетках
      others.forEach((cr,i)=>{
        const angle=(i/others.length)*Math.PI*2;
        cr.formRole='orbit';
        cr.formTargetX=Math.round(core.head().x+Math.cos(angle)*orbitR);
        cr.formTargetY=Math.round(core.head().y+Math.sin(angle)*orbitR);
      });
    }

    // МЕГАСТРУКТУРА — решётка
    for(let col in megByColor){
      const grp=megByColor[col];
      if(grp.length<4) continue;
      // центр масс
      const cx=Math.round(grp.reduce((s,x)=>s+x.head().x,0)/grp.length);
      const cy=Math.round(grp.reduce((s,x)=>s+x.head().y,0)/grp.length);
      // раздаём ячейки сетки
      const cols2=Math.ceil(Math.sqrt(grp.length));
      const spacing=8; // расстояние между узлами
      grp.forEach((cr,i)=>{
        const gx=i%cols2, gy=Math.floor(i/cols2);
        const offX=(gx-(cols2-1)/2)*spacing;
        const offY=(gy-Math.floor(grp.length/cols2)/2)*spacing;
        cr.formRole='grid';
        cr.formTargetX=Math.round(cx+offX);
        cr.formTargetY=Math.round(cy+offY);
      });
    }

    // Сброс формации у тех кто вышел из статуса
    for(let cr of aliveF){
      if(cr.socialStatus!=='empire'&&cr.socialStatus!=='mega'&&cr.formRole){
        cr.formRole=null; cr.formTargetX=null; cr.formTargetY=null;
      }
    }
  }

  // ── ЛАЗЕРЫ И МАГНЕТИЗМ ИМПЕРИЙ ──
  if(cycle % 60 === 0){
    // затухание лазеров
    lasers=lasers.filter(l=>l.timer>0);
    for(let l of lasers) l.timer--;

    // группируем взрослых по цвету и статусу
    const empGroups={};
    for(let i=0;i<creatures.length;i++){
      const cr=creatures[i]; if(!cr.alive) continue;
      const ss=cr.socialStatus;
      if(ss==='empire'||ss==='mega'){
        if(!empGroups[cr.color]) empGroups[cr.color]={members:[],cx:0,cy:0,ss};
        empGroups[cr.color].members.push(cr);
      }
    }
    for(let col in empGroups){
      const g=empGroups[col];
      g.cx=g.members.reduce((s,x)=>s+x.head().x,0)/g.members.length;
      g.cy=g.members.reduce((s,x)=>s+x.head().y,0)/g.members.length;
    }
    const empCols=Object.keys(empGroups);

    // ЛАЗЕРЫ: две империи/меги рядом → стреляют друг в друга
    for(let i=0;i<empCols.length;i++){
      for(let j=i+1;j<empCols.length;j++){
        const a=empGroups[empCols[i]], b=empGroups[empCols[j]];
        const dist=Math.hypot(a.cx-b.cx,a.cy-b.cy);
        const maxDist=a.ss==='mega'&&b.ss==='mega'?90:a.ss==='mega'||b.ss==='mega'?70:35;
        if(dist<maxDist){
          // добавляем лазер
          lasers.push({x1:a.cx,y1:a.cy,x2:b.cx,y2:b.cy,
            color1:empCols[i],color2:empCols[j],timer:6,
            power:a.ss==='mega'||b.ss==='mega'?2:1});
          // урон: снижаем энергию членов обеих групп
          for(let m of a.members) m.energy=Math.max(10,m.energy-0.8);
          for(let m of b.members) m.energy=Math.max(10,m.energy-0.8);
          // при долгом обстреле — распад на колонию
          if(cycle%600===0){
            for(let m of a.members) if(Math.random()<0.15){ m.socialStatus='colony'; m.inEmpire=false; m.bondedTo=null; }
            for(let m of b.members) if(Math.random()<0.15){ m.socialStatus='colony'; m.inEmpire=false; m.bondedTo=null; }
          }
        }
      }
    }

    // МАГНЕТИЗМ: притягивают мелочь
    for(let col in empGroups){
      const g=empGroups[col];
      const attractR=g.ss==='mega'?50:30;
      for(let i=0;i<creatures.length;i++){
        const cr=creatures[i];
        if(!cr.alive||cr.color!==col||cr.socialStatus==='empire'||cr.socialStatus==='mega') continue;
        const d=Math.hypot(cr.head().x-g.cx,cr.head().y-g.cy);
        if(d<attractR&&d>5){
          const a=Math.atan2(g.cy-cr.head().y,g.cx-cr.head().x);
          cr.dx=Math.round(Math.cos(a)); cr.dy=Math.round(Math.sin(a));
        }
      }
    }

    // ── ФОРМАЦИИ ──
    // Империя: планетарная — ядро в центре, остальные по орбитам
    // Мега: решётка — существа в ячейках сетки
    for(let col in empGroups){
      const g=empGroups[col];
      const mbs=g.members;
      if(mbs.length<3) continue;
      // центр масс
      const cx=g.cx, cy=g.cy;

      if(g.ss==='empire'){
        // Планетарная: сортируем по размеру — самое крупное = ядро
        mbs.sort((a,b)=>b.size-a.size);
        const nucleus=mbs[0];
        // Ядро стремится к центру
        const da=Math.atan2(cy-nucleus.head().y, cx-nucleus.head().x);
        if(Math.hypot(nucleus.head().x-cx,nucleus.head().y-cy)>3){
          nucleus.dx=Math.round(Math.cos(da)); nucleus.dy=Math.round(Math.sin(da));
        }
        // Остальные — по орбитам вокруг ядра
        const orbitR = 8 + Math.floor(mbs.length/3);
        for(let mi=1;mi<mbs.length;mi++){
          const angle = (mi/(mbs.length-1))*Math.PI*2 + cycle*0.005;
          const tx = nucleus.head().x + Math.cos(angle)*orbitR;
          const ty = nucleus.head().y + Math.sin(angle)*orbitR;
          const mb=mbs[mi];
          const md=Math.hypot(mb.head().x-tx, mb.head().y-ty);
          if(md>2){
            const ma=Math.atan2(ty-mb.head().y, tx-mb.head().x);
            mb.dx=Math.round(Math.cos(ma)); mb.dy=Math.round(Math.sin(ma));
          }
        }

      } else if(g.ss==='mega'){
        // Решётка: вычисляем ячейку для каждого
        const gridStep=7;
        const cols2=Math.ceil(Math.sqrt(mbs.length));
        for(let mi=0;mi<mbs.length;mi++){
          const row=Math.floor(mi/cols2), col2=mi%cols2;
          const tx=cx+(col2-cols2/2+0.5)*gridStep;
          const ty=cy+(row-Math.ceil(mbs.length/cols2)/2+0.5)*gridStep;
          const mb=mbs[mi];
          const md=Math.hypot(mb.head().x-tx, mb.head().y-ty);
          if(md>2){
            const ma=Math.atan2(ty-mb.head().y, tx-mb.head().x);
            mb.dx=Math.round(Math.cos(ma)); mb.dy=Math.round(Math.sin(ma));
          }
        }
      }
    }
  }

  // ── ФОРМАЦИИ ИМПЕРИЙ И МЕГ ──
  if(cycle % 60 === 0){
    const aliveF = creatures.filter(x=>x.alive);
    // сбрасываем формации
    formations = {};

    // ИМПЕРИИ → планетарная система (ядро + орбиты)
    const empByColor = {};
    for(let x of aliveF){
      if(x.socialStatus==='empire'){
        if(!empByColor[x.color]) empByColor[x.color]=[];
        empByColor[x.color].push(x);
      }
    }
    for(let col in empByColor){
      const grp=empByColor[col];
      if(grp.length<3) continue;
      // ядро — самое крупное существо
      grp.sort((a,b)=>b.size-a.size);
      const nucleus=grp[0];
      const members=[];
      // орбитальные слоты вокруг ядра
      const orbitR=8; // радиус орбиты в клетках
      for(let i=1;i<grp.length;i++){
        const angle=(i-1)/(grp.length-1)*Math.PI*2;
        members.push({
          id:grp[i].id,
          slotX:Math.round(Math.cos(angle)*orbitR),
          slotY:Math.round(Math.sin(angle)*orbitR)
        });
      }
      formations[col]={type:'empire',nucleus,members};
    }

    // МЕГАСТРУКТУРЫ → решётка
    const megByColor = {};
    for(let x of aliveF){
      if(x.socialStatus==='mega'){
        if(!megByColor[x.color]) megByColor[x.color]=[];
        megByColor[x.color].push(x);
      }
    }
    for(let col in megByColor){
      const grp=megByColor[col];
      if(grp.length<4) continue;
      // центр масс
      const cx=Math.round(grp.reduce((s,x)=>s+x.head().x,0)/grp.length);
      const cy=Math.round(grp.reduce((s,x)=>s+x.head().y,0)/grp.length);
      // расставляем по сетке 4x4
      const step=7; // шаг сетки
      const members=[];
      let idx2=0;
      const gridW=Math.ceil(Math.sqrt(grp.length));
      for(let r=0;r<gridW&&idx2<grp.length;r++){
        for(let cc2=0;cc2<gridW&&idx2<grp.length;cc2++){
          members.push({
            id:grp[idx2].id,
            slotX:(cc2-Math.floor(gridW/2))*step,
            slotY:(r-Math.floor(gridW/2))*step
          });
          idx2++;
        }
      }
      formations[col]={type:'mega',cx,cy,members};
    }
  }

  // ── ВОЙНЫ ИМПЕРИЙ ──
  if(cycle % 40 === 0){
    // сбрасываем флаги войны
    for(let x of creatures) if(x.alive) x.atWar=false;

    // ищем пары империй/мег разных цветов которые встретились
    const bigGroups = {};
    for(let x of alive){
      if(x.socialStatus==='empire'||x.socialStatus==='mega'){
        if(!bigGroups[x.color]) bigGroups[x.color]={members:[],cx:0,cy:0};
        bigGroups[x.color].members.push(x);
      }
    }
    // центры масс
    for(let col in bigGroups){
      const g=bigGroups[col];
      g.cx=g.members.reduce((s,x)=>s+x.head().x,0)/g.members.length;
      g.cy=g.members.reduce((s,x)=>s+x.head().y,0)/g.members.length;
    }
    // проверяем близость разных групп
    const cols=Object.keys(bigGroups);
    for(let i=0;i<cols.length;i++){
      for(let j=i+1;j<cols.length;j++){
        const a=bigGroups[cols[i]], b=bigGroups[cols[j]];
        const d=Math.hypot(a.cx-b.cx, a.cy-b.cy);
        if(d<35){ // империи встретились!
          const key=[cols[i],cols[j]].sort().join('_');
          if(!wars[key]){
            wars[key]={startCycle:cycle,intensity:0};
            // найти имя империи если есть
          const nameI = alive.find(x=>x.color===cols[i]&&x.groupName)?.groupName||colorName(cols[i]);
          const nameJ = alive.find(x=>x.color===cols[j]&&x.groupName)?.groupName||colorName(cols[j]);
          addLog('⚔️ ВОЙНА: '+nameI+' vs '+nameJ+'!');
          }
          wars[key].intensity=Math.min(1,(cycle-wars[key].startCycle)/500);
          // помечаем участников
          for(let x of a.members) x.atWar=true;
          for(let x of b.members) x.atWar=true;
        }
      }
    }
    // завершаем войны где стороны разошлись
    for(let key in wars){
      const [c1,c2]=key.split('_');
      if(!bigGroups[c1]||!bigGroups[c2]){
        const winner=bigGroups[c1]?c1:bigGroups[c2]?c2:null;
        const winName=alive.find&&alive.find(x=>x.color===winner&&x.groupName)?.groupName||colorName(winner);
        if(winner) addLog('🏆 '+winName+' выиграла войну!');
        delete wars[key];
      }
    }
  }

  // ── ВЫБРОС СПОР из мегаструктур (независимо от размножения) ──
  if(cycle % 80 === 0){
    const megaByColor = {};
    for(let x of alive){
      if(x.socialStatus==='mega'){
        if(!megaByColor[x.color]) megaByColor[x.color]=[];
        megaByColor[x.color].push(x);
      }
    }
    for(let col in megaByColor){
      const grp = megaByColor[col];
      if(spores.filter(s=>s.alive&&s.color===col).length > 12) continue; // не больше 12 спор одного вида
      // каждые 80 тиков мегаструктура выбрасывает 1-3 споры
      const count = 1 + Math.floor(Math.random()*3);
      for(let k=0;k<count;k++){
        const parent = grp[Math.floor(Math.random()*grp.length)];
        const ph = parent.head();
        const ox = Math.floor(Math.random()*13) - 6; // широкое боковое рассеивание
        const oy = -(1 + Math.floor(Math.random()*4)); // вверх
        const sx = Math.max(1, Math.min(COLS-2, ph.x + ox));
        const sy = Math.max(1, ph.y + oy);
        const sp = new Spore(sx, sy, col);
        sp.eatOwn = false; // обычная спора — только чужой цвет
        spores.push(sp);
      }
    }
  }

  // ── МИГРАЦИЯ КОЛОНИЙ ──
  if(cycle % 2000 === 0){
    const migColors = new Set();
    for(let i=0;i<alive.length;i++){
      const cr=alive[i];
      if((cr.socialStatus==='colony'||cr.socialStatus==='empire') && !migColors.has(cr.color)){
        migColors.add(cr.color);
        // даём всей группе общий импульс в случайном направлении
        const mdx = Math.random()<0.5?1:-1;
        const mdy = Math.random()<0.33?-1:Math.random()<0.5?0:1;
        const grp5=alive.filter(x=>x.color===cr.color&&x.socialStatus!=='solo');
        for(const m5 of grp5){ m5.dx=mdx; m5.dy=mdy; }
        if(grp5.length>2) addLog('🚶 '+colorName(cr.color)+' мигрирует');
      }
    }
  }

  // ── МИГРАЦИЯ КОЛОНИЙ ──
  if(cycle % 500 === 0){
    const colGroups={};
    for(let i=0;i<creatures.length;i++){
      const x=creatures[i];
      if(!x.alive) continue;
      if(x.socialStatus==='colony'||x.socialStatus==='empire'){
        if(!colGroups[x.color]) colGroups[x.color]=[];
        colGroups[x.color].push(x);
      }
    }
    for(let col in colGroups){
      if(!migrations[col] || cycle > migrations[col].until){
        // новое направление миграции раз в 500 тиков
        const angle = Math.random()*Math.PI*2;
        migrations[col]={
          dx: Math.cos(angle)>0?1:-1,
          dy: Math.random()<0.3?(Math.sin(angle)>0?1:-1):0,
          until: cycle+2000
        };
      }
    }
  }

  // ── СИМБИОЗ ──
  if(cycle % 300 === 0){
    const colorGroups2={};
    for(let i=0;i<creatures.length;i++){
      const x=creatures[i]; if(!x.alive) continue;
      if(!colorGroups2[x.color]) colorGroups2[x.color]={cx:0,cy:0,n:0};
      colorGroups2[x.color].cx+=x.head().x;
      colorGroups2[x.color].cy+=x.head().y;
      colorGroups2[x.color].n++;
    }
    for(let col in colorGroups2){
      const g=colorGroups2[col];
      g.cx=g.cx/g.n; g.cy=g.cy/g.n;
    }
    const cols2=Object.keys(colorGroups2);
    for(let i=0;i<cols2.length;i++) for(let j=i+1;j<cols2.length;j++){
      const a=colorGroups2[cols2[i]], b=colorGroups2[cols2[j]];
      const d=Math.hypot(a.cx-b.cx,a.cy-b.cy);
      const key=[cols2[i],cols2[j]].sort().join('_');
      if(d<40 && !wars[key]){
        symbiosis[key]=(symbiosis[key]||0)+1;
        if(symbiosis[key]===5)
          addLog('🤝 Симбиоз: '+colorName(cols2[i])+' и '+colorName(cols2[j]));
      } else {
        if(symbiosis[key]) symbiosis[key]=Math.max(0,symbiosis[key]-1);
      }
    }
  }

  // ── РАСПАД МЕГАСТРУКТУР ──
  if(cycle % 200 === 0){
    const megaGroups={};
    for(let x of alive){
      if(x.socialStatus==='mega'){
        if(!megaGroups[x.color]) megaGroups[x.color]=[];
        megaGroups[x.color].push(x);
      }
    }
    for(let col in megaGroups){
      const grp=megaGroups[col];
      // мегаструктура нестабильна после 800 циклов существования
      if(grp.length>=18 && !(splitCooldown[col]&&cycle<splitCooldown[col])){
        if(Math.random()<0.008){ // ~0.8% шанс каждые 200 тиков = редко
          // делим пополам: половина разлетается в стороны
          const half=Math.floor(grp.length/2);
          const splinters=grp.slice(0,half);
          for(let x of splinters){
            // разрыв связей
            x.bondedTo=null;
            x.socialStatus='solo';
            // резкий импульс в сторону
            x.dx=Math.random()<0.5?3:-3;
            x.dy=Math.floor(Math.random()*3)-1;
            x.energy*=0.7; // распад стоит энергии
          }
          splitCooldown[col]=cycle+2000;
          addLog('💥 Мегаструктура '+colorName(col)+' раскололась!');
        }
      }
    }
  }

  // ── СЕЗОНЫ ──
  seasonTimer++;
  if(seasonTimer >= SEASON_LEN){
    seasonTimer = 0;
    const seasons = ['spring','summer','autumn','winter'];
    const idx = seasons.indexOf(season);
    season = seasons[(idx+1) % 4];
    const names = {spring:'🌱 Весна',summer:'☀ Лето',autumn:'🍂 Осень',winter:'❄ Зима'};
    addLog(names[season] + ' наступает');
  }

  // ── ВЫМИРАНИЕ ──
  if(cycle % 300 === 0){
    const sp5 = new Set(alive.map(x=>x.color));
    for(const col5 of activeColors){
      if(!sp5.has(col5) && !extinctLog.find(e=>e.color===col5)){
        extinctLog.push({color:col5, cycle});
        addLog('☠ Вид '+colorName(col5)+' вымер. Эпоха закончена.');
        // кладбище — перекрасить почву этого цвета в более тёмный оттенок
        for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
          if(soil[y]&&soil[y][x]&&soil[y][x].color===col5){
            soil[y][x].cemetery = true;
            soil[y][x].shade = Math.max(0.08, (soil[y][x].shade||0.4)*0.4);
          }
        }
      }
    }
  }

  // ── СЕЗОННЫЕ СОБЫТИЯ ──
  if(cycle % SEASON_LEN === 0){
    const s = getSeason();
    addLog('🌍 '+SEASON_NAMES[s]+' наступила');
    if(s===3) addLog('❄ Зима: фотосинтез почти замер. Выживут сильнейшие.');
    if(s===1) addLog('☀ Лето: жизнь процветает!');
  }

  // ── ВЫМИРАНИЕ ──
  if(cycle % 300 === 0){
    for(let col of [...activeColors]){
      const cnt = creatures.filter(x=>x.alive&&x.color===col).length;
      if(cnt===0 && !extinctColors.has(col)){
        extinctColors.add(col);
        addLog('💀 Вид '+colorName(col)+' вымер. Остались руины.');
        // превратить часть их почвы в «кладбищенский» серый
        for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
          if(soil[y]&&soil[y][x]&&soil[y][x].color===col&&Math.random()<0.4)
            soil[y][x].cemetery = true;
        }
      }
    }
  }

  // ── СИМБИОЗ ──
  if(cycle % 200 === 0){
    const aliveC = creatures.filter(x=>x.alive);
    const byColor = {};
    for(let x of aliveC){ if(!byColor[x.color]) byColor[x.color]={cx:0,cy:0,n:0}; byColor[x.color].cx+=x.head().x; byColor[x.color].cy+=x.head().y; byColor[x.color].n++; }
    for(let col in byColor){ byColor[col].cx/=byColor[col].n; byColor[col].cy/=byColor[col].n; }
    const cols = Object.keys(byColor);
    for(let i=0;i<cols.length;i++) for(let j=i+1;j<cols.length;j++){
      const a=byColor[cols[i]], b=byColor[cols[j]];
      const d=Math.hypot(a.cx-b.cx,a.cy-b.cy);
      const key=[cols[i],cols[j]].sort().join('_');
      if(d<30 && !wars[key]){
        symbiosis[key]=(symbiosis[key]||0)+1;
        if(symbiosis[key]===10) addLog('🤝 Симбиоз: '+colorName(cols[i])+' и '+colorName(cols[j])+' — союзники!');
      } else { if(symbiosis[key]) symbiosis[key]=Math.max(0,(symbiosis[key]||0)-1); }
    }
  }

  // ── МИГРАЦИЯ КОЛОНИЙ ──
  if(cycle % 1500 === 0){
    const sp2 = new Set(creatures.filter(x=>x.alive).map(x=>x.color));
    for(let col of sp2){
      if(!migrationDir[col] || cycle > migrationDir[col].until){
        const angle = Math.random()*Math.PI*2;
        migrationDir[col]={dx:Math.cos(angle),dy:Math.sin(angle),until:cycle+3000};
        if(Math.random()<0.3) addLog('🚶 '+colorName(col)+' начинает миграцию');
      }
    }
  }

  // ── СЕЗОНЫ (каждые 6000 тиков = ~0.75 суток) ──
  seasonTimer++;
  if(seasonTimer >= 80000){
    seasonTimer = 0;
    const seasons = ['spring','summer','autumn','winter'];
    const cur = seasons.indexOf(season);
    season = seasons[(cur+1) % 4];
    const names = {spring:'🌱 Весна',summer:'☀ Лето',autumn:'🍂 Осень',winter:'❄ Зима'};
    addLog(names[season]+' наступила');
  }

  // история популяций
  if(cycle % 200 === 0){
    const snap={total:0, byColor:{}};
    for(let i=0;i<creatures.length;i++){
      const cr=creatures[i]; if(!cr.alive) continue;
      snap.total++;
      snap.byColor[cr.color]=(snap.byColor[cr.color]||0)+1;
    }
    popHistory.push(snap);
    if(popHistory.length>POP_HISTORY_LEN) popHistory.shift();
  }

  if(cycle%8000===0  && Math.random()<0.06 && !drought)      triggerDrought();
  if(cycle%12000===0 && Math.random()<0.05 && !geneticStorm) triggerStorm();
  if(cycle%20000===0 && Math.random()<0.04 && !flood)         triggerFlood();
  if(cycle%100000===0 && Math.random()<0.30 && !leviathan)      spawnLeviathan();
  updateLeviathan();
}

// ── ЛЕВИАФАН ───────────────────────────────────────────────────────
function spawnLeviathan(){
  if(leviathan) return;
  const dir  = Math.random()<0.5 ? 1 : -1; // 1=слева, -1=справа
  const w    = Math.floor(COLS * 0.25);     // ширина ~¼ экрана
  const h    = Math.floor(ROWS * 0.12);     // высота ~12% экрана
  const startX = dir===1 ? -w : COLS;
  const y    = Math.floor(ROWS * 0.15 + Math.random() * ROWS * 0.5);
  // цвет — тёмный, почти чёрный с оттенком
  const hue  = Math.floor(Math.random()*360);
  leviathan  = { x:startX, y, dir, w, h, speed:0.3, poopTimer:0,
                 color:`hsl(${hue},40%,18%)`, poopColor:PALETTE[Math.floor(Math.random()*PALETTE.length)] };
  cataCount.leviathan++; addLog('🐋 ЛЕВИАФАН появился! Мир содрогается...');
}

function updateLeviathan(){
  if(!leviathan) return;
  const lv = leviathan;
  lv.x += lv.dir * lv.speed;

  // поедание существ в зоне тела
  const lx1=Math.floor(lv.x), ly1=Math.floor(lv.y);
  const lx2=lx1+lv.w, ly2=ly1+lv.h;
  for(let i=0;i<creatures.length;i++){
    const cr=creatures[i]; if(!cr.alive) continue;
    const hx=cr.head().x, hy=cr.head().y;
    if(hx>=lx1&&hx<lx2&&hy>=ly1&&hy<ly2){
      if(cr.socialStatus==='mega'||cr.socialStatus==='empire'){
        // разгоняем — не убиваем, но рвём связи
        cr.bondedTo=null; cr.socialStatus='solo'; cr.inEmpire=false;
        const kick = lv.dir * (3+Math.random()*5);
        cr.dx=Math.round(kick); cr.dy=Math.round((Math.random()-0.5)*4);
        cr.energy*=0.6;
      } else if(cr.size>=8){
        // взрослых — разгоняем с уроном
        cr.bondedTo=null; cr.socialStatus='solo';
        cr.energy*=0.4;
        cr.dx=Math.round(lv.dir*(2+Math.random()*3));
      } else {
        // мелких — поглощает
        cr.dieAsCorpse();
      }
    }
  }

  // поедание почвы в зоне тела
  for(let y=ly1;y<ly2&&y<ROWS;y++){
    for(let x=lx1;x<lx2&&x<COLS;x++){
      if(x>=0&&soil[y]&&soil[y][x]&&soil[y][x].solid) soil[y][x]=null;
    }
  }

  // КАЛ — споры нового цвета каждые 40 тиков
  lv.poopTimer++;
  if(lv.poopTimer>=40){
    lv.poopTimer=0;
    const poopX = lv.dir===1 ? lv.x : lv.x+lv.w;
    const poopY = lv.y+lv.h;
    // 30% — кал → строительный материал для гор
    for(let k=0;k<5;k++){
      const bx=Math.max(0,Math.min(COLS-1,Math.floor(poopX+(Math.random()-0.5)*lv.w*0.4)));
      dropSoil(bx, Math.floor(poopY), null, 12);
    }
    // 70% — живые (меньше чем съел, только 35% шанс на одно существо)
    if(Math.random()<0.35){
      const nx=Math.max(1,Math.min(COLS-2,Math.floor(poopX+(Math.random()-0.5)*4)));
      const ny=Math.max(2,Math.floor(poopY)-1);
      const baby=new Creature(nx,ny,lv.poopColor,1);
      baby.energy=55; baby.seekingColony=true; baby.name=genJuvName();
      creatures.push(baby);
      if(!activeColors.has(lv.poopColor)) activeColors.add(lv.poopColor);
    }
  }

  // исчез за краем экрана
  const gone = lv.dir===1 ? lv.x>COLS+10 : lv.x<-lv.w-10;
  if(gone){
    addLog('🐋 Левиафан ушёл. За ним — новая жизнь.');
    leviathan=null;
  }
}

// ── КАТАКЛИЗМЫ ─────────────────────────────────────────────────────
function meteorStrike(){
  const mx=10+Math.floor(Math.random()*(COLS-20));
  cataCount.meteor++; addLog('☄ МЕТЕОРИТ! Земля содрогается...');
  // вспышка — рисуем несколько кадров яркого белого
  meteorFlash={x:mx*CELL,timer:25};
  for(let i2=0;i2<creatures.length;i2++){
    const mc=creatures[i2];
    if(mc.alive&&Math.abs(mc.head().x-mx)<15&&Math.random()<0.65) mc.dieAsCorpse();
  }
  for(let y=GROUND_Y-5;y<ROWS;y++)
    for(let x=mx-14;x<mx+14;x++){
      if(x<0||x>=COLS)continue;
      const d=Math.abs(x-mx)+Math.abs(y-(GROUND_Y-1));
      if(d<8) soil[y][x]=null;
      else if(d<13) soil[y][x]={solid:true,color:null,shade:0.8,stardust:true};
    }
  for(let cr of creatures)
    if(c.alive&&Math.abs(c.head().x-mx)<24) c.energy=Math.min(200,c.energy*3);
}
function triggerDrought(){drought=true;droughtTimer=500;cataCount.drought++;addLog('☀ ВЕЛИКАЯ ЗАСУХА. Фотосинтез замер.');}
function triggerStorm() {geneticStorm=true;stormTimer=250;cataCount.storm++;addLog('🧬 ГЕНЕТИЧЕСКИЙ ШТОРМ! Жизнь меняется.');}

// ── ПОТОП ──────────────────────────────────────────────────────────
function triggerFlood(){
  if(flood) return;
  flood=true; floodTimer=700; floodLevel=0; cataCount.flood++;
  addLog('🌊 ВЕЛИКИЙ ПОТОП. Воды поднимаются...');
}

function floodAftermath(){
  // каждый труп с шансом 40% порождает новое существо-мутанта
  let born=0;
  const snapshot=[...corpses];
  for(let cp of snapshot){
    if(!cp.segs||cp.segs.length===0) continue;
    if(Math.random()<0.4){
      const mutRate=0.35; // потоп порождает много мутантов
      let col=cp.color;
      if(Math.random()<mutRate){
        const unused=PALETTE.filter(p=>!activeColors.has(p));
        col=unused.length>0?unused[0]:PALETTE[Math.floor(Math.random()*PALETTE.length)];
        activeColors.add(col);
      }
      const seg=cp.segs[Math.floor(Math.random()*cp.segs.length)];
      const top=getSoilTop(seg.x);
      const child=new Creature(seg.x,Math.max(2,top-1),col,1);
      child.energy=65; child.seekingColony=true; child.name=genJuvName();
      creatures.push(child);
      born++;
    }
  }
  corpses=[]; // вода смыла все трупы
  if(born>0) addLog(`🐣 Потоп породил ${born} новых существ!`);
}

// ── UI ─────────────────────────────────────────────────────────────

// ── СКРИНШОТ ──────────────────────────────────────────────────

// ── ИНИЦИАЛИЗАЦИЯ ──────────────────────────────────────────────────
function init(){
  initSoil(); creatures=[]; corpses=[]; spores=[]; activeColors.clear(); cycle=0; logs=[]; wars={}; splitCooldown={}; symbiosis={}; extinctLog=[]; season='summer'; seasonTimer=0; meteorFlash=null; scavengers=[]; leviathan=null; lasers=[]; formations={}; formations={}; cataCount={meteor:0,drought:0,storm:0,flood:0,leviathan:0};
  const startCols=PALETTE.slice(0,5);
  STARTER_COLORS = new Set(startCols);
  startCols.forEach(col=>{
    activeColors.add(col);
    for(let i=0;i<12;i++){
      const x=5+Math.floor(Math.random()*(COLS-10));
      const top=getSoilTop(x);
      const y=Math.max(2,top-1-Math.floor(Math.random()*4));
      const c=new Creature(x,y,col,1);
      c.energy=250;
      c.seekingColony=true;
      if(!c.name) c.name=genJuvName();
      creatures.push(c);
    }
  });
  addLog('🌍 Мир сотворён. Летопись начинается.');
}



// ── ПОДСВЕТКА СТРУКТУР ─────────────────────────────────────────
let hlType = null;
let selectedCreature = null;
// история популяций для графика
const POP_HISTORY_LEN = 120;
let popHistory = []; // [{total, byColor:{}}]

let creatureLog = []; // лог действий выбранного существа       // 'colony' | 'empire' | 'mega'
let hlUntil = 0;         // Date.now() до которого мигать (2 секунды)

// ── КАРТОЧКА СУЩЕСТВА ─────────────────────────────────────────
canvas.addEventListener('click', function(e){
  const rect = canvas.getBoundingClientRect();
  const mx = Math.floor((e.clientX - rect.left) / CELL);
  const my = Math.floor((e.clientY - rect.top)  / CELL);
  let found = null, minD = 2.5;
  for(let i=0;i<creatures.length;i++){
    const cr = creatures[i]; if(!cr.alive) continue;
    for(let s=0;s<cr.segments.length;s++){
      const seg=cr.segments[s];
      const d=Math.hypot(seg.x-mx, seg.y-my);
      if(d<minD){ minD=d; found=cr; }
    }
  }
  const card = document.getElementById('creature-card');
  if(!found){
    selectedCreature=null; creatureLog=[];
    card.style.display='none';
    return;
  }
  selectedCreature=found;
  creatureLog=[];
  card.style.display='block';
  updateCreatureCard();
});

function updateCreatureCard(){
  if(!selectedCreature) return;
  const cr=selectedCreature;
  if(!cr.alive){ selectedCreature=null; document.getElementById('creature-card').style.display='none'; return; }
  const card=document.getElementById('creature-card');
  const ssNames={solo:'Одиночка',colony:'🔵 Колония',empire:'⚔️ Империя',mega:'👑 Мегаструктура'};
  const logHtml=creatureLog.slice(0,5).map((l,i)=>
    '<div style="color:'+(i===0?'#aaa':'#555')+';font-size:9px;margin-top:1px">'+l+'</div>'
  ).join('');
  // имя существа с явными фоллбэками
  const crName      = cr.name      || (cr.size>=12 ? 'Взрослый' : 'Пиздюк');
  const crGroup     = cr.groupName || '';
  const crDisplayName = crGroup ? crName + ' / ' + crGroup : crName;
  card.innerHTML=
    '<div class="cc-name" style="color:'+cr.color+'">'+crDisplayName+'</div>'+
    '<div style="color:#555;font-size:9px;margin-bottom:3px">'+colorName(cr.color)+'</div>'+
    '<div class="cc-row"><span>Сег.</span><span class="cc-val">'+cr.size+'</span>'+
    ' <span>Энерг.</span><span class="cc-val">'+Math.round(cr.energy)+'</span></div>'+
    '<div class="cc-row"><span>Возраст</span><span class="cc-val">'+cr.age+'</span>'+
    ' <span>Вес</span><span class="cc-val">'+(cr.weight?cr.weight.toFixed(1):'—')+'</span></div>'+
    '<div class="cc-row"><span>Потомков</span><span class="cc-val">'+cr.offspring+'</span>'+
    ' <span>Мут.</span><span class="cc-val">'+cr.laterals.length+'</span></div>'+
    '<div class="cc-row" style="margin-top:3px"><span style="color:#777">'+
    (ssNames[cr.socialStatus]||'?')+'</span>'+
    (cr.atWar?'<span style="color:#ff4444">⚔️ Война</span>':'')+
    (cr.bondedTo?'<span style="color:#44aaff">🔗 Связь</span>':'')+'</div>'+
    (logHtml?'<div style="border-top:1px solid #1a1a22;margin-top:4px;padding-top:3px">'+logHtml+'</div>':'');
}

function triggerHighlight(type){
  hlType  = type;
  hlUntil = Date.now() + 2000;
}

document.getElementById('btnColonies').addEventListener('click', function(){ triggerHighlight('colony'); });
document.getElementById('btnEmpires') .addEventListener('click', function(){ triggerHighlight('empire'); });
document.getElementById('btnMegas')   .addEventListener('click', function(){ triggerHighlight('mega');   });

// ── СКРИНШОТ ──────────────────────────────────────────────────
document.getElementById('btnShot').addEventListener('click', function(){
  // Создаём временный canvas размером с весь экран (игровой + лог панель)
  const totalW = canvas.width + LOG_W;
  const totalH = canvas.height;
  const sc = document.createElement('canvas');
  sc.width  = totalW;
  sc.height = totalH;
  const sctx = sc.getContext('2d');
  // Рисуем фон
  sctx.fillStyle = '#0a0a0f';
  sctx.fillRect(0, 0, totalW, totalH);
  // Копируем игровой canvas
  sctx.drawImage(canvas, 0, 0);
  // Копируем лог-панель через html2canvas недоступен — рисуем упрощённо
  sctx.fillStyle = '#06060a';
  sctx.fillRect(canvas.width, 0, LOG_W, totalH);
  sctx.strokeStyle = '#1a1a22';
  sctx.lineWidth = 1;
  sctx.beginPath();
  sctx.moveTo(canvas.width, 0);
  sctx.lineTo(canvas.width, totalH);
  sctx.stroke();
  // Скачать
  const link = document.createElement('a');
  const ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  link.download = 'aquatorium-' + ts + '.png';
  link.href = sc.toDataURL('image/png');
  link.click();
});

// ── СКРИНШОТ ────────────────────────────────────────────────────
document.getElementById('btnShot').addEventListener('click', function(){
  // Создаём составной canvas: основной + лог-панель недоступна (DOM)
  // Скриншотим только canvas игры
  const link = document.createElement('a');

  link.href = canvas.toDataURL('image/png');

});

// ── ЧАСЫ ────────────────────────────────────────────────────────
function updateClock(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  const el = document.getElementById('sClock');
  if(el) el.textContent = h+':'+m+':'+s;
}
updateClock();
setInterval(updateClock, 1000);

function loop(){
  requestAnimationFrame(loop);
  if(paused)return;
  const steps=fastMode?6:1;
  for(let i=0;i<steps;i++)tick();
  try{ render(); } catch(e){ console.error('render error:',e); }
}
init();
requestAnimationFrame(loop);

// Счётчики обновляются каждые 200мс независимо от render()
setInterval(function(){
  try{
    const al=[];
    for(let i=0;i<creatures.length;i++) if(creatures[i].alive) al.push(creatures[i]);

    document.getElementById('sCycle').textContent     = Math.floor(cycle/3000);
    document.getElementById('sCreatures').textContent = al.length;

    let sp2=0; for(let i=0;i<spores.length;i++) if(spores[i].alive) sp2++;
    document.getElementById('sSpores').textContent = sp2;
    let scav2=0, totalFed=0;
    for(let i=0;i<scavengers.length;i++){
      if(scavengers[i].alive){ scav2++; totalFed+=scavengers[i].fed||0; }
    }
    const scEl=document.getElementById('sScavengers');
    if(scEl) scEl.textContent=scav2+(totalFed>0?' ('+totalFed+'🦴)':'');

    const ss2=new Set(); for(let i=0;i<al.length;i++) ss2.add(al[i].color);
    document.getElementById('sSpecies').textContent = ss2.size;

    let mc2=0; for(let i=0;i<al.length;i++) if(!STARTER_COLORS.has(al[i].color)) mc2++;
    const mp2=al.length>0?Math.round(mc2/al.length*100):0;
    document.getElementById('sMutants').textContent = mc2+' ('+mp2+'%)';

    let nC2=0,nE2=0,nM2=0; const sc2={};
    for(let i=0;i<al.length;i++){
      const x=al[i]; const s=x.socialStatus||'solo';
      if(!sc2[x.color]) sc2[x.color]={c:false,e:false,m:false};
      if(s==='colony') sc2[x.color].c=true;
      if(s==='empire') sc2[x.color].e=true;
      if(s==='mega')   sc2[x.color].m=true;
    }
    for(const k in sc2){
      if(sc2[k].m) nM2++; if(sc2[k].e) nE2++; if(sc2[k].c) nC2++;
    }
    document.getElementById('sColonies').textContent = nC2;
    document.getElementById('sEmpires').textContent  = nE2;
    document.getElementById('sMegas').textContent    = nM2;

    // событийный баннер
    // ── ГРАФ ПОПУЛЯЦИЙ в лог-панели ──
    const pgCanvas = document.getElementById('popGraph');
    if(pgCanvas && popHistory.length > 2){
      const pgCtx = pgCanvas.getContext('2d');
      const gw=pgCanvas.width, gh=pgCanvas.height;
      pgCtx.clearRect(0,0,gw,gh);
      // фон
      pgCtx.fillStyle='rgba(0,0,0,0.5)';
      pgCtx.fillRect(0,0,gw,gh);
      // сетка
      pgCtx.strokeStyle='rgba(255,255,255,0.05)';
      pgCtx.lineWidth=1;
      for(let gg=0;gg<4;gg++){
        pgCtx.beginPath();
        pgCtx.moveTo(0,Math.floor(gh/4*gg));
        pgCtx.lineTo(gw,Math.floor(gh/4*gg));
        pgCtx.stroke();
      }
      // максимум
      let maxPop2=1;
      for(let i=0;i<popHistory.length;i++) maxPop2=Math.max(maxPop2,popHistory[i].total);
      // белая линия — суммарная популяция
      pgCtx.strokeStyle='rgba(255,255,255,0.3)';
      pgCtx.lineWidth=1;
      pgCtx.beginPath();
      for(let i=0;i<popHistory.length;i++){
        const px2=Math.floor(i/(POP_HISTORY_LEN-1)*(gw-2))+1;
        const py2=gh-2-Math.floor(popHistory[i].total/maxPop2*(gh-6));
        i===0?pgCtx.moveTo(px2,py2):pgCtx.lineTo(px2,py2);
      }
      pgCtx.stroke();
      // цветные линии топ-4 видов
      const lastSnap2=popHistory[popHistory.length-1];
      const topColors2=Object.entries(lastSnap2.byColor).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[0]);
      for(let ci=0;ci<topColors2.length;ci++){
        const col2=topColors2[ci];
        const rgb2=hexRgb(col2);
        pgCtx.strokeStyle='rgba('+rgb2[0]+','+rgb2[1]+','+rgb2[2]+',0.75)';
        pgCtx.lineWidth=1;
        pgCtx.beginPath();
        let started2=false;
        for(let i=0;i<popHistory.length;i++){
          const v=popHistory[i].byColor[col2]||0;
          if(!v){started2=false;continue;}
          const px2=Math.floor(i/(POP_HISTORY_LEN-1)*(gw-2))+1;
          const py2=gh-2-Math.floor(v/maxPop2*(gh-6));
          if(!started2){pgCtx.moveTo(px2,py2);started2=true;}
          else pgCtx.lineTo(px2,py2);
        }
        pgCtx.stroke();
      }
    }

        if(clk){ const now=new Date(); clk.textContent=now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); }

    // часы
    const clk=document.getElementById('sClock');
    if(clk){ const now=new Date(); clk.textContent=now.toLocaleTimeString('ru-RU'); }

    // часы в UI
    const clockEl=document.getElementById('sClock');
    if(clockEl){
      const now=new Date();
      const hh=String(now.getHours()).padStart(2,'0');
      const mm=String(now.getMinutes()).padStart(2,'0');
      const ss=String(now.getSeconds()).padStart(2,'0');
      clockEl.textContent=hh+':'+mm+':'+ss;
    }
    updateCreatureCard();
    const banner=document.getElementById('event-banner');
    if(banner){
      let btext='', bcolor='';
      if(leviathan){ btext='🐋 ЛЕВИАФАН ПРОПЛЫВАЕТ!'; bcolor='#c06000'; }
      else if(flood){ btext='🌊 ВЕЛИКИЙ ПОТОП'; bcolor='#0055aa'; }
      else if(drought){ btext='☀️ ВЕЛИКАЯ ЗАСУХА'; bcolor='#aa4400'; }
      else if(geneticStorm){ btext='🧬 ГЕНЕТИЧЕСКИЙ ШТОРМ'; bcolor='#6600aa'; }
      if(btext){ banner.style.display='block'; banner.style.color=bcolor; banner.textContent=btext; }
      else { banner.style.display='none'; }
    }
    const cEl=document.getElementById('sCata');
    if(cEl) cEl.innerHTML='<span style="color:#888">катак: </span>'+
      '<b>☄'+cataCount.meteor+'</b> '+
      '<b>☀'+cataCount.drought+'</b> '+
      '<b>🧬'+cataCount.storm+'</b> '+
      '<b>🌊'+cataCount.flood+'</b> '+
      '<b>🐋'+cataCount.leviathan+'</b>';
    const ph=document.getElementById('sPhase');
    ph.innerHTML=isNight()
      ?'<b style="color:#99aaff;font-size:11px">🌙 Ночь</b>'
      :'<b style="color:#ffcc44;font-size:11px">☀ День</b>';
    const sn=document.getElementById('sSeason');
    if(sn){
      const snames={spring:'🌱 Весна',summer:'☀️ Лето',autumn:'🍂 Осень',winter:'❄️ Зима'};
      sn.style.color='#eee'; sn.innerHTML='<b style="font-size:11px">'+( snames[season]||'Лето')+'</b>';
    }
  } catch(e){ console.error('hud error:',e); }
}, 200);

});
