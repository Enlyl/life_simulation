function genAdultName(){
  const f = NAMES_FIRST[Math.floor(Math.random()*NAMES_FIRST.length)];
  const p = NAMES_PATRON[Math.floor(Math.random()*NAMES_PATRON.length)];
  return f+' '+p;
}
function genEmpireName(){
  const n = EMPIRE_NAMES[Math.floor(Math.random()*EMPIRE_NAMES.length)];
  return 'Империя '+n;
}
function genMegaName(){
  const a = MEGA_LETTERS[Math.floor(Math.random()*MEGA_LETTERS.length)];
  const b = MEGA_LETTERS[Math.floor(Math.random()*MEGA_LETTERS.length)];
  const c = MEGA_LETTERS[Math.floor(Math.random()*MEGA_LETTERS.length)];
  const n = 10+Math.floor(Math.random()*90);
  return a+b+c+'-'+n;
}
function genColonyName(){
  colonyCounter++;
  return 'Колония-'+colonyCounter;
}
// Запускается раз в 60 тиков. Union-Find по цвету.
// Гистерезис: понижение статуса только после 2 подряд циклов ниже порога.
const CLUSTER_RADIUS = 22;    // клетки — дистанция связи между членами
const THRESHOLDS = { mega:18, empire:8, colony:3 }; // мин. размер кластера
let clusterDowngrade = {}; // clusterDowngrade[id] = число циклов ниже порога

function detectClusters(){
  // собираем только живых взрослых (≥12 сег)
  const adults = creatures.filter(x=>x.alive && x.size>=12);

  // Union-Find
  const parent = {};
  for(let cr of adults) parent[cr.id] = cr.id;

  function find(id){
    while(parent[id]!==id) { parent[id]=parent[parent[id]]; id=parent[id]; }
    return id;
  }
  function union(a,b){ parent[find(a)]=find(b); }

  // соединяем существ одного цвета в радиусе CLUSTER_RADIUS
  for(let i=0;i<adults.length;i++){
    for(let j=i+1;j<adults.length;j++){
      const a=adults[i], b=adults[j];
      if(a.color!==b.color) continue;
      if(find(a.id)===find(b.id)) continue; // уже в одном кластере
      const d=Math.hypot(a.head().x-b.head().x, a.head().y-b.head().y);
      if(d<CLUSTER_RADIUS) union(a.id,b.id);
    }
  }

  // считаем размер каждого кластера
  const clusterSize = {};
  for(let cr of adults){
    const root=find(cr.id);
    clusterSize[root]=(clusterSize[root]||0)+1;
  }

  // присваиваем статус с гистерезисом
  for(let cr of adults){
    const root=find(cr.id);
    const sz=clusterSize[root]||1;
    const prevStatus=cr.socialStatus;

    let newStatus;
    if     (sz>=THRESHOLDS.mega)   newStatus='mega';
    else if(sz>=THRESHOLDS.empire) newStatus='empire';
    else if(sz>=THRESHOLDS.colony) newStatus='colony';
    else                           newStatus='solo';

    // повышение — мгновенное
    // понижение — только после 2 циклов подряд
    if(newStatus < prevStatus || // строковое сравнение не работает, используем веса
       statusWeight(newStatus) < statusWeight(prevStatus)){
      clusterDowngrade[cr.id]=(clusterDowngrade[cr.id]||0)+1;
      if(clusterDowngrade[cr.id]>=2) cr.socialStatus=newStatus;
      else cr.socialStatus=prevStatus; // держим старый статус ещё цикл
    } else {
      clusterDowngrade[cr.id]=0;
      cr.socialStatus=newStatus;
    }

    cr.inEmpire=(cr.socialStatus==='empire'||cr.socialStatus==='mega');

    // имя кластера — присваивается при формировании, хранится по root
    if(cr.socialStatus!=='solo'){
      if(!clusterNames[root]){
        if(cr.socialStatus==='mega')         clusterNames[root]=genMegaName();
        else if(cr.socialStatus==='empire')  clusterNames[root]=genEmpireName();
        else                                 clusterNames[root]=genColonyName();
        addLog('📛 '+clusterNames[root]+' ('+colorName(cr.color)+') сформирована');
      }
    }
    cr.clusterName = (cr.socialStatus==='solo') ? null : (clusterNames[root]||null);

    // логируем смену статуса
    if(prevStatus!==cr.socialStatus){
      if(cr.socialStatus==='mega')
        addLog('👑 МЕГАСТРУКТУРА '+colorName(cr.color)+' сформирована!');
      else if(prevStatus==='solo'&&cr.socialStatus==='colony')
        addLog('🔵 Колония '+colorName(cr.color)+' образована');
      if(selectedCreature&&selectedCreature.id===cr.id)
        addCreatureLog('→ стал: '+{solo:'одиночкой',colony:'колонией',empire:'империей',mega:'мегаструктурой'}[cr.socialStatus]);
    }
  }

  // молодые всегда solo
  for(let cr of creatures){
    if(cr.alive&&cr.size<12){
      cr.socialStatus='solo';
      cr.inEmpire=false;
    }
  }
}
function statusWeight(s){ return {solo:0,colony:1,empire:2,mega:3}[s]||0; }

function tick(){
  cycle++;
  coolBattleHeat();
  updateBanner();

  // === ГРАВИТАЦИЯ ПОЧВЫ — висящие блоки падают вниз ===
  if(cycle % 150 === 0){
    // проходим снизу вверх — блок падает если под ним пусто
    for(let y=ROWS-2; y>=0; y--){
      for(let x=0; x<COLS; x++){
        if(!(soil[y]&&soil[y][x]&&soil[y][x].solid)) continue;
        // проверяем клетку ниже
        if(soil[y+1]&&soil[y+1][x]&&soil[y+1][x].solid) continue;
        // под блоком пусто — падаем вниз до первой опоры
        const falling = soil[y][x];
        soil[y][x] = null;
        // находим куда упасть
        let landY = y+1;
        while(landY+1 < ROWS && !(soil[landY+1]&&soil[landY+1][x]&&soil[landY+1][x].solid)){
          landY++;
        }
        soil[landY][x] = falling;
        if(falling._css) falling._css = null; // сбрасываем кеш
      }
    }
  }
  if(cycle % 120 === 0){
    // ТЕКТОНИКА убрана — она создавала почву из воздуха
    // Теперь только осадки: блоки перемещаются, не создаются

    // ОСАДКИ: верхушки высоких гор осыпаются на соседей
    const erodeCount = Math.floor(COLS * 0.03);
    for(let i=0;i<erodeCount;i++){
      const ex = Math.floor(Math.random()*COLS);
      const top = getSoilTop(ex);
      if(top < GROUND_Y - 4 && soil[top] && soil[top][ex]){
        const savedColor = soil[top][ex].color;
        soil[top][ex] = null;
        const nx = ex + (Math.random()<0.5 ? -1 : 1);
        if(nx>=0 && nx<COLS){
          const nTop = getSoilTop(nx);
          if(nTop >= top){
            setSoil(nx, nTop-1, savedColor);
          }
        }
      }
    }
  }

  // === ЧИСТКА ПАМЯТИ — мёртвые объекты ===
  if(cycle % 3000 === 0){
    creatures = creatures.filter(cr=>cr.alive);
    spores    = spores.filter(sp=>sp.alive);
    corpses   = corpses.filter(cp=>cp.alive && cp.segs.length > 0);
    const liveMegaColors = new Set(creatures.filter(x=>x.alive&&x.socialStatus==='mega').map(x=>x.color));
    for(let col in megaPositions){ if(!liveMegaColors.has(col)) delete megaPositions[col]; }
  }

  // === МАССОВОЕ ВЫМИРАНИЕ — 95% экрана в трупах ===
  if(cycle % 120 === 0){
    // считаем суммарные сегменты живых трупов
    let totalCorpseSegs = 0;
    for(let cp of corpses) if(cp.alive) totalCorpseSegs += cp.segs.length;
    const LIVE_AREA = COLS * GROUND_Y; // клеток в живой зоне
    extinctionLevel = Math.min(1, totalCorpseSegs / (LIVE_AREA * 0.95));

    if(extinctionLevel >= 1 && !extinctionActive){
      extinctionActive = true;
      addLog('💀 МАССОВОЕ ВЫМИРАНИЕ. Трупы заполнили мир...');
      showBanner('💀 МАССОВОЕ ВЫМИРАНИЕ', '#886600', 2000);
    }

    if(extinctionActive){
      // 1. Споры едят трупы ВДВОЕ быстрее — увеличиваем их скорость временно
      for(let sp of spores){
        if(!sp.alive) continue;
        sp.stepTimer += 3; // ускоряем
      }

      // 2. Из каждого трупа с шансом 15% рождается новая спора-санитар
      if(Math.random() < 0.3){
        const liveCorpses = corpses.filter(cp=>cp.alive&&cp.segs.length>0);
        const sample = liveCorpses.slice(0, Math.min(5, liveCorpses.length));
        for(let cp of sample){
          if(Math.random()<0.15 && spores.length < 400){
            const spSeg = cp.segs[Math.floor(Math.random()*cp.segs.length)];
            const sp = new Spore(spSeg.x, Math.max(1, spSeg.y-1), cp.color);
            spores.push(sp);
          }
        }
      }

      // 3. Если трупов стало меньше 60% — событие заканчивается, рождаются редкие виды
      if(extinctionLevel < 0.6){
        extinctionActive = false;

        // Рождение обычных видов из трупов
        const liveCorpses2 = corpses.filter(cp=>cp.alive&&cp.segs.length>0);
        let bornNormal = 0;
        for(let cp of liveCorpses2.slice(0, 10)){
          if(Math.random()<0.4){
            const seg=cp.segs[0];
            const child=new Creature(seg.x,Math.max(2,seg.y-1),cp.color,2);
            child.energy=100; child.seekingColony=true;
            creatures.push(child); bornNormal++;
          }
        }

        // Рождение РЕДКИХ видов (шанс зависит от масштаба вымирания)
        const unusedRare = RARE_PALETTE.filter(p=>!activeColors.has(p));
        const rareCount = Math.min(2, unusedRare.length);
        for(let ri=0; ri<rareCount; ri++){
          if(Math.random() < 0.6){ // 60% шанс на каждый редкий вид
            const rCol = unusedRare[ri];
            activeColors.add(rCol);
            rareColors.add(rCol);
            // редкий вид получает усиленные гены выживаемости
            genePool[rCol] = {
              aggression:    0.3 + Math.random()*0.4,
              metabolism:    0.4 + Math.random()*0.3, // низкий метаболизм = живучий
              photoRate:     1.5 + Math.random()*0.5, // высокий фотосинтез
              socialTendency:0.6 + Math.random()*0.4,
            };
            // рождается маленькая группа в разных местах экрана
            const spawnCount = 3 + Math.floor(Math.random()*4);
            for(let k=0; k<spawnCount; k++){
              const sx = 5 + Math.floor(Math.random()*(COLS-10));
              const top = getSoilTop(sx);
              const child = new Creature(sx, Math.max(2, top-2), rCol, 2);
              child.energy = 180;
              child.seekingColony = true;
              creatures.push(child);
            }
            addLog('🌟 РЕДКИЙ ВИД: '+colorName(rCol)+' возник из пепла!');
          }
        }
        if(bornNormal>0) addLog('🌱 Из вымирания возродилось '+bornNormal+' существ');
      }
    }
  }
  // видовой баланс + детектирование кластеров раз в 60 тиков
  if(cycle % 60 === 0){
    const totalPop = creatures.filter(x=>x.alive).length || 1;
    const colorCount = {};
    for(let x of creatures) if(x.alive) colorCount[x.color]=(colorCount[x.color]||0)+1;
    for(let x of creatures) if(x.alive) x.speciesFraction=(colorCount[x.color]||0)/totalPop;

    detectClusters();

    // обновляем историю популяции для графика
    popHistoryTick++;
    for(let col of activeColors){
      if(!popHistory[col]) popHistory[col]=[];
      popHistory[col].push(colorCount[col]||0);
      if(popHistory[col].length > POP_HISTORY_LEN) popHistory[col].shift();
    }
  }

  // смена сезона — сообщение в лог
  if(cycle % 6000 === 1){
    const s = getSeason();
    addLog(SEASON_NAMES[s] + ' наступила');
    // зима убивает слабейших — дополнительное давление
    if(s === 'winter'){
      for(let cr of creatures){
        if(cr.alive && cr.energy < 40 && Math.random() < 0.3) cr.die();
      }
    }
  }
  // территория постепенно угасает без присутствия империй
  if(cycle%40===0){
    for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++){
      if(territory[y]&&territory[y][x]&&Math.random()<0.05) territory[y][x]=null;
    }
  }

  if(droughtTimer>0){droughtTimer--;if(droughtTimer===0){drought=false;addLog('☁ Засуха окончилась.');}}
  if(stormTimer>0)  {stormTimer--;  if(stormTimer===0)  {geneticStorm=false;addLog('🌙 Шторм утих.');}}
  // потоп
  if(flood){
    floodTimer--;
    // вода поднимается первые 300 тиков, затем спадает
    const risePhase = floodTimer > 400;
    if(risePhase) floodLevel = Math.min(H*0.55, floodLevel+1.2);
    else          floodLevel = Math.max(0, floodLevel-0.8);
    // утопление существ в воде
    if(cycle%8===0){
      const waterY = Math.floor((H - floodLevel)/CELL);
      for(let c2 of creatures){
        if(!c2.alive)continue;
        if(c2.head().y > waterY && Math.random()<0.03) c2.dieAsCorpse();
      }
    }
    if(floodTimer<=0){
      flood=false; floodLevel=0;
      // после отступления воды — трупы оживают
      floodAftermath();
      addLog('🌊 Вода отступила. Из трупов рождается жизнь...');
    }
  }

  // споры
  for(let sp of spores) if(sp.alive) sp.update();
  if(spores.length > 300) spores = spores.filter(sp=>sp.alive);

  // трупы
  for(let cp of corpses) if(cp.alive) cp.update();
  if(corpses.length>200) corpses=corpses.filter(cp=>cp.alive);

  // существа
  for(let i2=0;i2<creatures.length;i2++){ if(creatures[i2].alive) creatures[i2].update(); }
  if(creatures.length>500) creatures=creatures.filter(cr=>cr.alive);

  // мягкий потолок биомассы — перенаселение давит энергию, не убивает сразу
  const alive=creatures.filter(cr=>cr.alive);
  const biomass=alive.reduce((s,x)=>{
    const w=x.socialStatus==='mega'?5:x.socialStatus==='empire'?3:x.socialStatus==='colony'?2:1;
    return s+w;
  },0);
  if(biomass>350){
    // мягкое давление
    const pressure = (biomass - 350) / 350;
    for(let cr of alive) cr.energy -= pressure * 0.8;
  }
  if(biomass>500){
    // жёсткий предел
    const sorted=alive.slice().sort((a,b)=>a.energy-b.energy);
    let bm=biomass;
    for(let cr of sorted){
      if(bm<=400) break;
      const w=cr.socialStatus==='mega'?5:cr.socialStatus==='empire'?3:cr.socialStatus==='colony'?2:1;
      cr.die(); bm-=w;
    }
  }

  // жёсткий пол 5
  const aliveNow=creatures.filter(cr=>cr.alive);
  if(aliveNow.length<30){
    const cols=[...activeColors];
    for(let n=0;n<30-aliveNow.length;n++){
      const col=cols[Math.floor(Math.random()*cols.length)]||PALETTE[0];
      const x=5+Math.floor(Math.random()*(COLS-10));
      const top=getSoilTop(x);
      const c2=new Creature(x,Math.max(2,top-2),col,2);
      c2.energy=150; // достаточно энергии чтобы выжить
      creatures.push(c2);
    }
    addLog('🌱 Жизнь возрождается из пепла');
  }

  // ── ВОЙНЫ ИМПЕРИЙ ──
  if(cycle % 40 === 0){
    // сбрасываем флаги войны
    for(let x of creatures) if(x.alive) x.atWar=false;

    // Группируем по кластерам (не по цвету) — каждый кластер может воевать отдельно
    // empire одного цвета НЕ воюют. mega одного цвета МОГУТ воевать.
    const clusters = {}; // clusters[key] = {members, cx, cy, color, status}
    for(let x of alive){
      if(x.socialStatus!=='empire'&&x.socialStatus!=='mega') continue;
      // ключ кластера: для empire — цвет (все одного цвета = союзники)
      // для mega — clusterName или id первого члена (отдельные кластеры)
      const ckey = x.socialStatus==='empire'
        ? 'emp_'+x.color
        : 'meg_'+(x.clusterName||x.color+'_'+x.id);
      if(!clusters[ckey]) clusters[ckey]={members:[],cx:0,cy:0,color:x.color,status:x.socialStatus};
      clusters[ckey].members.push(x);
    }
    for(let k in clusters){
      const g=clusters[k];
      g.cx=g.members.reduce((s,x)=>s+x.head().x,0)/g.members.length;
      g.cy=g.members.reduce((s,x)=>s+x.head().y,0)/g.members.length;
    }
    const ckeys=Object.keys(clusters);
    for(let i=0;i<ckeys.length;i++){
      for(let j=i+1;j<ckeys.length;j++){
        const a=clusters[ckeys[i]], b=clusters[ckeys[j]];
        // empire одного цвета не воюют никогда
        if(a.status==='empire'&&b.status==='empire'&&a.color===b.color) continue;
        const d=Math.hypot(a.cx-b.cx, a.cy-b.cy);
        if(d<35){
          const key=[ckeys[i],ckeys[j]].sort().join('__');
          if(truces[key]) continue;
          if(!wars[key]){
            wars[key]={startCycle:cycle,intensity:0};
            const same=a.color===b.color?' (гражданская война!)':'';
            addLog('⚔️ ВОЙНА: '+colorName(a.color)+' vs '+colorName(b.color)+same);
          }
          wars[key].intensity=Math.min(1,(cycle-wars[key].startCycle)/500);
          for(let x of a.members) x.atWar=true;
          for(let x of b.members) x.atWar=true;
        }
      }
    }
    // завершаем войны где кластеры исчезли
    for(let key in wars){
      const [c1,c2]=key.split('__');
      if(!clusters[c1]||!clusters[c2]){
        const winner=clusters[c1]?clusters[c1].color:clusters[c2]?clusters[c2].color:null;
        if(winner) addLog('🏆 '+colorName(winner)+' выиграла войну!');
        delete wars[key];
      } else {
        const war=wars[key];
        if(cycle-war.startCycle>4000&&!truces[key]){
          const bothLarge=clusters[c1].members.length>5&&clusters[c2].members.length>5;
          if(bothLarge&&Math.random()<0.008){
            truces[key]=cycle+6000;
            delete wars[key];
            for(let x of creatures) if(x.alive) x.atWar=false;
            addLog('🤝 Перемирие: '+colorName(clusters[c1]?.color||'?')+' и '+colorName(clusters[c2]?.color||'?'));
          }
        }
      }
    }
    for(let key in truces){
      if(cycle>truces[key]){
        delete truces[key];
        const [c1,c2]=key.split('__');
        addLog('😤 Перемирие истекло');
      }
    }
  }


  // ── ЛАЗЕРЫ, МАГНЕТИЗМ, КОЛОНИИ МЕГ ──
  if(cycle % 30 === 0){
    lasers = lasers.filter(l=>l.timer>0);
    for(let l of lasers) l.timer--;

    const empireGroups={}, megaGroups2={};
    for(let cr of alive){
      if(cr.socialStatus==='empire'||cr.socialStatus==='mega'){
        const grp=cr.socialStatus==='mega'?megaGroups2:empireGroups;
        if(!grp[cr.color]) grp[cr.color]={members:[],cx:0,cy:0};
        grp[cr.color].members.push(cr);
      }
    }
    for(let grp of [empireGroups,megaGroups2]){
      for(let col in grp){
        const g=grp[col];
        g.cx=g.members.reduce((s,x)=>s+x.head().x,0)/g.members.length;
        g.cy=g.members.reduce((s,x)=>s+x.head().y,0)/g.members.length;
      }
    }

    // лазеры империй (d 20-45) — одного цвета не стреляют
    const empKeys=Object.keys(empireGroups);
    for(let i=0;i<empKeys.length;i++) for(let j=i+1;j<empKeys.length;j++){
      if(empKeys[i]===empKeys[j]) continue; // один цвет — не стреляем
      const a=empireGroups[empKeys[i]],b=empireGroups[empKeys[j]];
      const key=['emp_'+empKeys[i],'emp_'+empKeys[j]].sort().join('__');
      if(truces[key]) continue;
      const d=Math.hypot(a.cx-b.cx,a.cy-b.cy);
      if(d>=20&&d<=45){
        const sh=a.members[Math.floor(Math.random()*a.members.length)];
        const tg=b.members[Math.floor(Math.random()*b.members.length)];
        if(sh&&tg){
          lasers.push({x1:sh.head().x,y1:sh.head().y,x2:tg.head().x,y2:tg.head().y,color:empKeys[i],timer:8,isMega:false});
          tg.energy-=8+Math.random()*4;
        }
      }
    }

    // лазеры мег (d 30-70) — одного цвета тоже могут стрелять
    const megKeys=Object.keys(megaGroups2);
    for(let i=0;i<megKeys.length;i++) for(let j=i+1;j<megKeys.length;j++){
      const a=megaGroups2[megKeys[i]],b=megaGroups2[megKeys[j]];
      const key=['meg_'+megKeys[i],'meg_'+megKeys[j]].sort().join('__');
      if(truces[key]) continue;
      const d=Math.hypot(a.cx-b.cx,a.cy-b.cy);
      if(d>=30&&d<=70){
        const sh=a.members[Math.floor(Math.random()*a.members.length)];
        const tg=b.members[Math.floor(Math.random()*b.members.length)];
        if(sh&&tg){
          lasers.push({x1:sh.head().x,y1:sh.head().y,x2:tg.head().x,y2:tg.head().y,color:megKeys[i],timer:10,isMega:true});
          tg.energy-=15+Math.random()*8;
        }
      }
    }

    // магнетизм империй (r=30)
    for(let col in empireGroups){
      const g=empireGroups[col];
      for(let cr of alive){
        if(cr.color===col||cr.socialStatus!=='solo') continue;
        const d=Math.hypot(cr.head().x-g.cx,cr.head().y-g.cy);
        if(d<30&&d>3){
          const a=Math.atan2(g.cy-cr.head().y,g.cx-cr.head().x);
          cr.dx=Math.round(Math.cos(a)); cr.dy=Math.round(Math.sin(a));
          if(d<5&&Math.random()<0.2){ cr.energy-=15; if(g.members[0]) g.members[0].energy+=10; }
        }
      }
    }

    // магнетизм мег (r=60)
    for(let col in megaGroups2){
      const g=megaGroups2[col];
      for(let cr of alive){
        if(cr.color===col||cr.socialStatus==='mega') continue;
        const d=Math.hypot(cr.head().x-g.cx,cr.head().y-g.cy);
        if(d<60&&d>5){
          const a=Math.atan2(g.cy-cr.head().y,g.cx-cr.head().x);
          if(Math.random()<0.6){ cr.dx=Math.round(Math.cos(a)); cr.dy=Math.round(Math.sin(a)); }
          if(d<8&&Math.random()<0.15){ cr.energy-=20; if(g.members[0]) g.members[0].energy+=15; }
        }
      }
    }

    // меги рождают дочерние колонии раз в 600 тиков
    if(cycle%600===0){
      for(let col in megaGroups2){
        const g=megaGroups2[col];
        if(Math.random()<0.4){
          const parent=g.members[Math.floor(Math.random()*g.members.length)];
          const ph=parent.head();
          const sx=Math.max(3,Math.min(COLS-4,ph.x+(Math.random()<0.5?15:-15)));
          const sy=Math.max(3,Math.min(ROWS-4,ph.y+Math.floor(Math.random()*7)-3));
          for(let k=0;k<3+Math.floor(Math.random()*2);k++){
            const child=new Creature(Math.max(1,Math.min(COLS-2,sx+Math.floor(Math.random()*5)-2)),Math.max(1,sy),col,3);
            child.energy=120; child.genes=mutateGenes(genePool[col]||defaultGenes(),0.05);
            child.isAdult=true; child.name=genAdultName(); child.seekingColony=true;
            creatures.push(child);
          }
          addLog("👑 "+colorName(col)+" основала дочернюю колонию");
        }
      }
    }
  }

  // ── ВЫБРОС СПОР из мегаструктур ──
  if(cycle % 80 === 0){
    const megaByColor = {};
    for(let x of alive){
      if(x.socialStatus==='mega'){
        if(!megaByColor[x.color]) megaByColor[x.color]=[];
        megaByColor[x.color].push(x);
      }
    }
    for(let col in megaByColor){
      const grp = megaByColor[col];
      // центр масс меги
      const mcx = Math.round(grp.reduce((s,x)=>s+x.head().x,0)/grp.length);
      const mcy = Math.round(grp.reduce((s,x)=>s+x.head().y,0)/grp.length);

      // === ДЕТЕКТИРОВАНИЕ ЗАСТРЕВАНИЯ ===
      const DAY_TICKS = 6000; // тиков в сутках
      if(!megaPositions[col]){
        megaPositions[col] = {cx:mcx, cy:mcy, stuckSince:cycle};
      } else {
        const mp = megaPositions[col];
        const moved = Math.hypot(mcx-mp.cx, mcy-mp.cy);
        if(moved > 3){
          // мега сдвинулась — сбрасываем таймер
          mp.cx=mcx; mp.cy=mcy; mp.stuckSince=cycle;
        }
        // застряла более 3 суток (18000 тиков)?
        const stuckDays = (cycle - mp.stuckSince) / DAY_TICKS;
        if(stuckDays >= 3){
          // === СПОРЫ-БУРИЛЬЩИКИ — едят свой и чужой цвет ===
          if(spores.filter(s=>s.alive&&s.color===col+'_drill').length < 6){
            const drillCount = 2 + Math.floor(Math.random()*3);
            for(let k=0;k<drillCount;k++){
              const parent = grp[Math.floor(Math.random()*grp.length)];
              const ph = parent.head();
              // выпускаем вниз и в стороны
              const ox = Math.floor(Math.random()*7)-3;
              const oy = Math.floor(Math.random()*3); // вниз или горизонтально
              const sp = new Spore(
                Math.max(1,Math.min(COLS-2, ph.x+ox)),
                Math.min(ROWS-2, ph.y+oy),
                col
              );
              sp.isDriller = true; // ест свой и чужой цвет
              spores.push(sp);
            }
            if(Math.random()<0.3) addLog('⛏ '+colorName(col)+' выпустила бурильщиков!');
          }
          continue; // застрявшая мега не выпускает обычные споры
        }
      }

      // === ОБЫЧНЫЕ СПОРЫ — вверх и в стороны ===
      if(spores.filter(s=>s.alive&&s.color===col&&!s.isDriller).length > 12) continue;
      const count = 1 + Math.floor(Math.random()*3);
      for(let k=0;k<count;k++){
        const parent = grp[Math.floor(Math.random()*grp.length)];
        const ph = parent.head();
        const ox = Math.floor(Math.random()*11) - 5;
        const oy = -(1 + Math.floor(Math.random()*4)); // вверх
        const sx = Math.max(1, Math.min(COLS-2, ph.x + ox));
        const sy = Math.max(1, ph.y + oy);
        spores.push(new Spore(sx, sy, col));
      }
    }
    // чистим позиции мег которых больше нет
    for(let col in megaPositions){
      if(!megaByColor[col]) delete megaPositions[col];
    }
  }

  // ── РАСПАД МЕГАСТРУКТУР ──
  if(cycle % 200 === 0){
    const megaGroups={};
    for(let x of alive){
      if(x.socialStatus==='mega'){
        if(!megaGroups[x.color]) megaGroups[x.color]=[];
        megaGroups[x.color].push(x);
      }
    }
    for(let col in megaGroups){
      const grp=megaGroups[col];
      // мегаструктура нестабильна после 800 циклов существования
      if(grp.length>=18 && !(splitCooldown[col]&&cycle<splitCooldown[col])){
        if(Math.random()<0.008){ // ~0.8% шанс каждые 200 тиков = редко
          // делим пополам: половина разлетается в стороны
          const half=Math.floor(grp.length/2);
          const splinters=grp.slice(0,half);
          for(let x of splinters){
            // разрыв связей
            x.bondedTo=null;
            x.socialStatus='solo';
            // резкий импульс в сторону
            x.dx=Math.random()<0.5?3:-3;
            x.dy=Math.floor(Math.random()*3)-1;
            x.energy*=0.7; // распад стоит энергии
          }
          splitCooldown[col]=cycle+2000;
          addLog('💥 Мегаструктура '+colorName(col)+' раскололась!');
        }
      }
    }
  }

  if(cycle%48000===0  && Math.random()<0.12 && !drought)      triggerDrought();
  if(cycle%72000===0  && Math.random()<0.10 && !geneticStorm) triggerStorm();
  if(cycle%96000===0  && Math.random()<0.08 && !flood)        triggerFlood();

  // ── ЛЕВИАФАН ──
  if(leviathan && leviathan.alive) leviathan.update();
  if(leviathan && !leviathan.alive) leviathan=null;
  if(!leviathan && cycle%100000===0 && cycle>0 && Math.random()<0.30){
    leviathan = new Leviathan();
    addLog('🐋 ЛЕВИАФАН появился из глубин!');
    showBanner('🐋 ЛЕВИАФАН', '#226644', 3000);
    cataclysms.leviathan++;
  }
}

// ── КАТАКЛИЗМЫ ─────────────────────────────────────────────────────
function meteorStrike(){
  const mx=10+Math.floor(Math.random()*(COLS-20));
  addLog('☄ МЕТЕОРИТ! Земля содрогается...');
  showBanner('☄ МЕТЕОРИТ', '#cc4400', 60);
  cataclysms.meteor++;
  meteorFlash={x:mx*CELL,timer:25};
  for(let cr of creatures)
    if(cr.alive&&Math.abs(cr.head().x-mx)<15&&Math.random()<0.65) cr.dieAsCorpse();
  for(let y=GROUND_Y-5;y<ROWS;y++)
    for(let x=mx-14;x<mx+14;x++){
      if(x<0||x>=COLS)continue;
      const d=Math.abs(x-mx)+Math.abs(y-(GROUND_Y-1));
      if(d<8) soil[y][x]=null;
      else if(d<13) soil[y][x]={solid:true,color:null,shade:0.8,stardust:true};
    }
  for(let cr of creatures)
    if(cr.alive&&Math.abs(cr.head().x-mx)<24) cr.energy=Math.min(200,cr.energy*3);
}
function triggerDrought(){
  drought=true; droughtTimer=500;
  addLog('☀ ВЕЛИКАЯ ЗАСУХА. Фотосинтез замер.');
  showBanner('☀ ВЕЛИКАЯ ЗАСУХА', '#cc6600', 500);
  cataclysms.drought++;
}
function triggerStorm(){
  geneticStorm=true; stormTimer=250;
  addLog('🧬 ГЕНЕТИЧЕСКИЙ ШТОРМ! Жизнь меняется.');
  showBanner('🧬 ГЕНЕТИЧЕСКИЙ ШТОРМ', '#8844cc', 250);
  cataclysms.storm++;
}

// ── ПОТОП ──────────────────────────────────────────────────────────
function triggerFlood(){
  if(flood) return;
  flood=true; floodTimer=700; floodLevel=0;
  addLog('🌊 ВЕЛИКИЙ ПОТОП. Воды поднимаются...');
  showBanner('🌊 ВЕЛИКИЙ ПОТОП', '#2255cc', 700);
  cataclysms.flood++;
}

function floodAftermath(){
  // каждый труп с шансом 40% порождает новое существо-мутанта
  let born=0;
  const snapshot=[...corpses];
  for(let cp of snapshot){
    if(!cp.segs||cp.segs.length===0) continue;
    if(Math.random()<0.4){
      const mutRate=0.35; // потоп порождает много мутантов
      let col=cp.color;
      if(Math.random()<mutRate){
        const unused=PALETTE.filter(p=>!activeColors.has(p));
        col=unused.length>0?unused[0]:PALETTE[Math.floor(Math.random()*PALETTE.length)];
        activeColors.add(col);
      }
      const seg=cp.segs[Math.floor(Math.random()*cp.segs.length)];
      const top=getSoilTop(seg.x);
      const child=new Creature(seg.x,Math.max(2,top-1),col,1);
      child.energy=65; child.seekingColony=true;
      creatures.push(child);
      born++;
    }
  }
  corpses=[]; // вода смыла все трупы
  if(born>0) addLog(`🐣 Потоп породил ${born} новых существ!`);
}

// ── UI ─────────────────────────────────────────────────────────────
document.getElementById('btnPause').addEventListener('click',function(){
  paused=!paused; this.textContent=paused?'▶ Продолжить':'⏸ Пауза';
  this.classList.toggle('active',paused);
});
document.getElementById('btnFast').addEventListener('click',function(){
  fastMode=!fastMode; this.classList.toggle('active',fastMode);
});
document.getElementById('btnMeteor').addEventListener('click',meteorStrike);
document.getElementById('btnDrought').addEventListener('click',triggerDrought);
document.getElementById('btnStorm').addEventListener('click',triggerStorm);
document.getElementById('btnFlood').addEventListener('click',triggerFlood);
document.getElementById('btnLeviathan').addEventListener('click',function(){
  if(!leviathan){
    leviathan=new Leviathan();
    addLog('🐋 ЛЕВИАФАН появился из глубин!');
    showBanner('🐋 ЛЕВИАФАН', '#226644', 3000);
    cataclysms.leviathan++;
  }
});

// ── ИНИЦИАЛИЗАЦИЯ ──────────────────────────────────────────────────
function init(){
  initSoil(); creatures=[]; corpses=[]; spores=[]; activeColors.clear(); rareColors.clear(); cycle=0; logs=[]; wars={}; truces={}; splitCooldown={}; meteorFlash=null; genePool={}; popHistory={}; leviathan=null; clusterDowngrade={}; clusterNames={}; colonyCounter=0; lasers=[]; megaPositions={}; extinctionActive=false; extinctionLevel=0;
  cataclysms.meteor=0; cataclysms.drought=0; cataclysms.storm=0; cataclysms.flood=0; cataclysms.leviathan=0;
  const startCols=PALETTE.slice(0,7);
  STARTER_COLORS = new Set(startCols);
  startCols.forEach(col=>{
    activeColors.add(col);
    genePool[col] = defaultGenes();
    for(let i=0;i<16;i++){
      const x=5+Math.floor(Math.random()*(COLS-10));
      const top=getSoilTop(x);
      const y=Math.max(2,top-1-Math.floor(Math.random()*4));
      const c=new Creature(x,y,col,3);
      c.energy=300;
      c.seekingColony=true;
      creatures.push(c);
    }
  });
  addLog('🌍 Мир сотворён. Летопись начинается.');
}

// ── КЛИК НА СУЩЕСТВО ──────────────────────────────────────────────
// ── ПОДСВЕТКА СТРУКТУР ──────────────────────────────────────────
let highlightType = null;   // 'colony' | 'empire' | 'mega' | null
let highlightEnd  = 0;      // cycle когда заканчивается подсветка
const HIGHLIGHT_DURATION = 120; // тиков (~2 сек при обычной скорости)

function triggerHighlight(type){
  highlightType = type;
  highlightEnd  = cycle + HIGHLIGHT_DURATION;
}

document.getElementById('btnColonies').addEventListener('click', ()=>triggerHighlight('colony'));
document.getElementById('btnEmpires') .addEventListener('click', ()=>triggerHighlight('empire'));
document.getElementById('btnMegas')   .addEventListener('click', ()=>triggerHighlight('mega'));

let selectedCreature = null;
canvas.addEventListener('click', function(e){
  const rect=canvas.getBoundingClientRect();
  const mx=Math.floor((e.clientX-rect.left)/CELL);
  const my=Math.floor((e.clientY-rect.top)/CELL);
  let found=null, minD=3;
  for(let cr of creatures){
    if(!cr.alive)continue;
    for(let seg of cr.segments){
      const d=Math.abs(seg.x-mx)+Math.abs(seg.y-my);
      if(d<minD){minD=d;found=cr;}
    }
  }
  selectedCreature=found;
  const card=document.getElementById('creature-card');
  const clog=document.getElementById('creature-log');
  if(!found){
    card.className='';
    card.innerHTML='· кликни на существо ·';
    if(clog){ clog.innerHTML=''; }
    return;
  }
  // очищаем лог при смене существа
  if(clog) clog.innerHTML='';
  creatureLogs=[];
  updateCreatureCard();
});

function updateCreatureCard(){
  if(!selectedCreature||!selectedCreature.alive) return;
  const cr=selectedCreature;
  const card=document.getElementById('creature-card');
  if(!card) return;
  card.className='active';
  const clusterLine = cr.clusterName ? `<div class="card-row"><span>Кластер</span><span class="val" style="color:${cr.color};font-size:9px">${cr.clusterName}</span></div>` : '';
  card.innerHTML=`
    <div class="card-name" style="color:${cr.color}">${cr.name}</div>
    <div class="card-row"><span>Вид</span><span class="val">${colorName(cr.color)}</span></div>
    <div class="card-row"><span>Статус</span><span class="val">${{solo:'Одиночка',colony:'🔵Колония',empire:'⚔️Империя',mega:'👑Мега'}[cr.socialStatus]||'?'}</span></div>
    ${clusterLine}
    <div class="card-row"><span>Сегм.</span><span class="val">${cr.size}</span></div>
    <div class="card-row"><span>Энергия</span><span class="val">${Math.round(cr.energy)}</span></div>
    <div class="card-row"><span>Возраст</span><span class="val">${cr.age}</span></div>
    <div class="card-row"><span>Потомков</span><span class="val">${cr.offspring}</span></div>
    <div class="gene-title">ГЕНЫ</div>
    <div class="card-row"><span>Агрессия</span><span class="val" style="color:${cr.genes.aggression>0.7?'#e05252':cr.genes.aggression<0.3?'#52e07a':'#c8c0a0'}">${cr.genes.aggression.toFixed(2)}</span></div>
    <div class="card-row"><span>Метаболизм</span><span class="val">${cr.genes.metabolism.toFixed(2)}</span></div>
    <div class="card-row"><span>Фотосинтез</span><span class="val">${cr.genes.photoRate.toFixed(2)}</span></div>
    <div class="card-row"><span>Социальн.</span><span class="val">${cr.genes.socialTendency.toFixed(2)}</span></div>
  `;
}

function loop(){
  requestAnimationFrame(loop);
  if(paused)return;
  const steps=fastMode?6:1;
  for(let i=0;i<steps;i++)tick();
  render();
}
init();
requestAnimationFrame(loop);
</script>
